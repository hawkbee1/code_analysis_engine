name: code_analysis_engine
description: The dart_code_3D analysis engine that turns Dart source into a code graph, driven by configurable rules.
version: 0.1.0+1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  # Only the parser (parseString) and the AST: they compile to JS and Wasm.
  analyzer: ^13.0.0
  # Command line parsing of the developer CLI (bin/analyze.dart).
  args: ^2.5.0
  code_graph:
    path: ../code_graph
  code_source_client:
    path: ../code_source_client
  equatable: ^3.0.0
  glob: ^2.1.0
  meta: ^1.16.0
  path: ^1.9.1

dev_dependencies:
  mocktail: ^1.0.5
  test: ^1.31.0
  very_good_analysis: ^11.0.0
